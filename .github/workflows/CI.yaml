name: MLOps CI Pipeline

permissions:
  contents: write

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  train:

    runs-on: ubuntu-latest

    steps:

    - name: Run actions/checkout@v3
      uses: actions/checkout@v4

    - name: Setup Python 3.12.7
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Check Env
      run: |
        python --version
        pip --version
        pwd

    - name: Install Dependencies
      run: |
        pip install mlflow pandas numpy scikit-learn matplotlib

    - name: Debug MLproject
      run : |
        echo "=== MLPROJECT ==="
        cat MLProject/MLProject

        echo ""
        echo "=== Files ==="
        ls -la MLProject

    - name: Run MLflow Project
      run: |
        cd MLProject
        mlflow run .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mlruns
        path: MLProject/mlruns

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Build Docker Model
      run: |
        docker build -t teen-mental-health .

    - name: Tag Docker Image
      run: |
        docker tag \
        teen-mental-health \
        ${{ secrets.DOCKER_HUB_USERNAME }}/teen-mental-health:latest

    - name: Push Image Docker
      run: |
        docker push \
        ${{ secrets.DOCKER_HUB_USERNAME }}/teen-mental-health:latest
